<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #1e3a8a, #3b82f6);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-card {
        background: white;
        padding: 48px 40px;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 400px;
      }

      .login-card h1 {
        text-align: center;
        color: #1e3a8a;
        font-size: 28px;
        margin-bottom: 8px;
      }

      .login-card p {
        text-align: center;
        color: #6b7280;
        font-size: 14px;
        margin-bottom: 32px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        color: #374151;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .form-group input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        transition: border 0.3s;
      }

      .form-group input:focus {
        border-color: #3b82f6;
      }

      .login-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #1e3a8a, #3b82f6);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.3s;
        margin-top: 8px;
      }

      .login-btn:hover {
        opacity: 0.9;
      }

      .version {
        text-align: center;
        color: #9ca3af;
        font-size: 12px;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h1>Welcome Back 👋</h1>
      <p>Please login to continue</p>

      <div class="form-group">
        <label>Username</label>
        <input type="text" placeholder="Enter your username" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Enter your password" />
      </div>

      <button class="login-btn">Login</button>

      <p class="version">v1.0.0 — CI/CD App</p>
    </div>
  </body>
</html>
