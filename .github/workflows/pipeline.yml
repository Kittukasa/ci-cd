name: CI Pipeline

on:
  pull_request:
    branches:
      - dev
      - test
      - main

jobs:
  prettier:
    if: github.base_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install
      - name: Run Prettier Check
        run: npm run prettier

  eslint-and-coverage:
    if: github.base_ref == 'test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install
      - name: Run ESLint
        run: npm run lint
      - name: Run Coverage
        run: npm run test